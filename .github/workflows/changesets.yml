name: Changesets

on:
  push:
    branches: [develop]

permissions: {}

concurrency:
  group: changesets-develop
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify
        uses: ./.github/actions/verify

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

      - name: Pack packages
        if: steps.select-mode.outputs.mode == 'publish'
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}

  version:
    needs: prepare
    if: needs.prepare.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Version packages
        uses: changesets/action/version@v2
        with:
          script: npm run changeset:version

  publish:
    needs: prepare
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Publish packed packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.prepare.outputs.pack-dir-artifact-id }}
          push-git-tags: true
          create-github-releases: true
