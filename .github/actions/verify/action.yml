name: Verify
description: Install dependencies, build, check style, run tests, and audit dependencies

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build
      shell: bash
      run: npm run build

    - name: Check style
      shell: bash
      run: npm run check-style:ci

    - name: Test
      shell: bash
      run: npm run test

    - name: Audit
      shell: bash
      run: npm audit --workspaces
